<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="storeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#047857" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Rounded Background -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#storeGrad)" filter="url(#shadow)" />

  <!-- Inner Store Front Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Store Awning Top Line -->
    <path d="M28 44 L100 44" />
    <!-- Store Awning Roof -->
    <path d="M34 44 L40 28 L88 28 L94 44" />
    <!-- Canopy Scallops -->
    <path d="M28 44 C28 52 38 52 38 44 C38 52 48 52 48 44 C48 52 58 52 58 44 C58 52 68 52 68 44 C68 52 78 52 78 44 C78 52 88 52 88 44 C88 52 100 52 100 44" fill="#ffffff" fill-opacity="0.2" />
    <!-- Shop Building Walls -->
    <path d="M33 50 L33 98 C33 100 35 102 37 102 L91 102 C93 102 95 100 95 98 L95 50" />
    <!-- Door -->
    <path d="M52 102 L52 74 C52 71 55 68 58 68 L70 68 C73 68 76 71 76 74 L76 102" fill="#ffffff" fill-opacity="0.25" />
    <!-- Counter Window / Shelf -->
    <line x1="42" y1="68" x2="42" y2="82" />
    <line x1="86" y1="68" x2="86" y2="82" />
  </g>

  <!-- Sparkle Accent Dot -->
  <circle cx="96" cy="30" r="5" fill="#fef08a" />
</svg>
